<!DOCTYPE html>
<html>
<head>
    <title>Grid Layout</title>
    <style>
        .container {
            display: grid;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            grid-template-columns: 200px 1fr;
            gap: 10px;
        }
        .header { grid-area: header; background-color: lightcoral; padding: 20px; }
        .sidebar { grid-area: sidebar; background-color: lightgreen; padding: 20px; height: 200px; }
        .main { grid-area: main; background-color: lightyellow; padding: 20px; }
        .footer { grid-area: footer; background-color: lightblue; padding: 20px; }
    </style>
</head>
<body>
    <h1>Grid Page Layout</h1>
    <div class="container">
        <div class="header">Header</div>
        <div class="sidebar">Sidebar</div>
        <div class="main">Main Content</div>
        <div class="footer">Footer</div>
    </div>
</body>
</html>
