<!DOCTYPE html>
<html>
<head>
    <title>Inline and Internal CSS</title>
    <style>
        h1 {
            color: navy;
        }
        .highlight {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h1>This is CSS Fundamentals</h1>
    <p style="color: red;">This paragraph is red using inline style.</p>
    <p class="highlight">This paragraph has yellow background using highlight class.</p>
</body>
</html>
