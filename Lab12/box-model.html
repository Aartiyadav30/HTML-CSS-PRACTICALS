<!DOCTYPE html>
<html>
<head>
    <title>Box Model</title>
    <style>
        .box1 {
            width: 200px;
            padding: 20px;
            border: 5px solid blue;
            box-sizing: content-box;
            background-color: lightblue;
            margin-bottom: 20px;
        }
        .box2 {
            width: 200px;
            padding: 20px;
            border: 5px solid green;
            box-sizing: border-box;
            background-color: lightgreen;
        }
    </style>
</head>
<body>
    <h1>Box Model Comparison</h1>
    <div class="box1">This is Content-Box (Bigger)</div>
    <div class="box2">This is Border-Box (Smaller)</div>
</body>
</html>
