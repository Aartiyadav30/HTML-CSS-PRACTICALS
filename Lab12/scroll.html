<!DOCTYPE html>
<html>
<head>
    <title>Scroll Box</title>
    <style>
        .box {
            height: 120px;
            overflow: auto;
            border: 2px solid black;
            background-color: lightpink;
            width: 300px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Scrolling Box</h1>
    <div class="box">
        <p>Line 1</p>
        <p>Line 2</p>
        <p>Line 3</p>
        <p>Line 4</p>
        <p>Line 5</p>
    </div>
</body>
</html>
