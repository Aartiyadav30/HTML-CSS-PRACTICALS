<!DOCTYPE html>
<html>
<head>
    <title>Feedback Form</title>
</head>
<body>
    <h1>Feedback Form</h1>
    <form>
        Name: <input type="text" placeholder="Your name"><br><br>
        How was our website?
        <select>
            <option>Very Good</option>
            <option>Good</option>
            <option>Average</option>
            <option>Bad</option>
        </select><br><br>
        Your Feedback:<br>
        <textarea rows="4" cols="30" placeholder="Write your feedback"></textarea><br><br>
        <input type="submit" value="Send Feedback">
    </form>
</body>
</html>
