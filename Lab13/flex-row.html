<!DOCTYPE html>
<html>
<head>
    <title>Flex Row</title>
    <style>
        .container {
            display: flex;
            gap: 10px;
            background-color: lightgrey;
            padding: 10px;
        }
        .box {
            width: 100px;
            height: 100px;
            background-color: lightblue;
            text-align: center;
            line-height: 100px;
            border: 2px solid blue;
        }
    </style>
</head>
<body>
    <h1>Flex Row</h1>
    <div class="container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
    </div>
</body>
</html>
