<!DOCTYPE html>
<html>
<head>
    <title>Centred Cards</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }
        .card {
            background-color: lightyellow;
            border: 2px solid black;
            border-radius: 12px;
            padding: 16px;
            width: 180px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Centred Cards</h1>
    <div class="row">
        <div class="card">
            <h3>Starter</h3>
            <p>Price: 199</p>
        </div>
        <div class="card">
            <h3>Standard</h3>
            <p>Price: 349</p>
        </div>
        <div class="card">
            <h3>Premium</h3>
            <p>Price: 499</p>
        </div>
    </div>
</body>
</html>
