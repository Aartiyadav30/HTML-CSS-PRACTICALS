<!DOCTYPE html>
<html>
<head>
    <title>Stationery Shop</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }
        .card {
            background-color: lightgreen;
            border: 2px solid black;
            border-radius: 12px;
            padding: 16px;
            width: 180px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Stationery Shop</h1>
    <div class="row">
        <div class="card">
            <h3>Notebook</h3>
            <p>Price: 60</p>
        </div>
        <div class="card">
            <h3>Pen</h3>
            <p>Price: 15</p>
        </div>
        <div class="card">
            <h3>Bag</h3>
            <p>Price: 350</p>
        </div>
        <div class="card">
            <h3>Book</h3>
            <p>Price: 120</p>
        </div>
    </div>
</body>
</html>
