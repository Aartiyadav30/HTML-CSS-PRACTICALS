<!DOCTYPE html>
<html>
<head>
    <title>Flex Cards</title>
    <style>
        .container {
            display: flex;
            justify-content: space-between;
            gap: 16px;
        }
        .card {
            background-color: lightpink;
            border: 2px solid black;
            border-radius: 12px;
            padding: 16px;
            width: 200px;
        }
    </style>
</head>
<body>
    <h1>Flex Cards</h1>
    <div class="container">
        <div class="card">
            <h3>Card 1</h3>
            <p>This is first card.</p>
        </div>
        <div class="card">
            <h3>Card 2</h3>
            <p>This is second card.</p>
        </div>
        <div class="card">
            <h3>Card 3</h3>
            <p>This is third card.</p>
        </div>
    </div>
</body>
</html>
