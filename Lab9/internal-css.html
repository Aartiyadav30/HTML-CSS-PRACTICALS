<!DOCTYPE html>
<html>
<head>
    <title>Internal CSS</title>
    <style>
        h1 { color: purple; text-align: center; }
        p { color: orange; font-size: 18px; }
        body { background-color: lightyellow; }
    </style>
</head>
<body>
    <h1>This is Internal CSS</h1>
    <p>This is styled using style tag.</p>
    <p>Background is light yellow.</p>
</body>
</html>
