<!DOCTYPE html>
<html>
<head>
    <title>CSS Units</title>
    <style>
        .box1 {
            width: 200px;
            height: 40px;
            background-color: lightblue;
        }
        .box2 {
            width: 50%;
            height: 40px;
            background-color: lightgreen;
        }
        p {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="box1">This is 200px wide box</div>
    <br>
    <div class="box2">This is 50% wide box</div>
    <p>This paragraph is 1.5rem in size.</p>
</body>
</html>
