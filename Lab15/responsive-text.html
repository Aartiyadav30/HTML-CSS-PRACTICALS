<!DOCTYPE html>
<html>
<head>
    <title>Responsive Text</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-size: 1rem;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h1 {
            font-size: 1.5rem;
        }
        @media (min-width: 600px) {
            h1 {
                font-size: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <h1>Responsive Text</h1>
    <p>This is a paragraph with responsive text. The heading is larger when the window is 600px wide or more.</p>
</body>
</html>
